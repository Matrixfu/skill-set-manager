name: publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # 公共 npm 源发布需要 npm Automation token（仓库 secret 名 NPM_TOKEN）。
      # 包内 .npmrc 用 ${NPM_TOKEN} 取 token；setup-node 生成的 user .npmrc 走 NODE_AUTH_TOKEN。
      - run: npm publish
        working-directory: plugin/skill-set-manager
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
