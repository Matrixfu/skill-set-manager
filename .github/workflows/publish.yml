name: publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      # 包内 .npmrc 用 ${NPM_TOKEN} 取 token（本地开发口径）；CI 里两个名字都指向仓库内置 GITHUB_TOKEN，
      # 避免为空导致 401。setup-node 生成的 user .npmrc 走 NODE_AUTH_TOKEN。
      - run: npm publish
        working-directory: plugin/skill-set-manager
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
